      <button id="health" class="health" type="button"></button>
      <button id="history-btn" class="tool-btn" type="button" aria-pressed="false" hidden title="Scrub through git history: every merged PR and commit">

      <span id="conn" class="conn" data-state="connecting"><i></i><span>Connecting</span></span>

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg>
      </button>

  </header>

  <main class="main">
    <div class="canvas">
    <section id="stage" class="stage" aria-label="Architecture map">
      <div id="world" class="world">
        <svg id="wires" class="wires" aria-hidden="true"></svg>
        <div id="nodes" class="nodes"></div>
      </div>

      <details class="legend hud" open>
        <summary class="legend-title">Arrows mean “imports from”</summary>
        <div><svg viewBox="0 0 34 10"><path class="sw sw-allowed" d="M1 5h26"/><path class="sw-head-allowed" d="M26 1l7 4-7 4z"/></svg>Allowed by the plan</div>
        <div><svg viewBox="0 0 34 10"><path class="sw sw-violation" d="M1 5h26"/><path class="sw-head-violation" d="M26 1l7 4-7 4z"/></svg>Breaks the plan</div>
        <div><svg viewBox="0 0 34 10"><path class="sw sw-planned" d="M1 5h26"/></svg>Allowed, not used yet</div>
        <div class="live-only"><span class="sw-affected"></span>May be affected by the last edit</div>
        <div class="past-only"><svg viewBox="0 0 34 10"><path class="sw sw-violation sw-old" d="M1 5h26"/><path class="sw-head-violation sw-old" d="M26 1l7 4-7 4z"/></svg>Broke the plan before this</div>
        <div class="past-only"><span class="sw-changed"></span><span class="scope" data-word="Changed">Changed in this commit</span></div>
        <div class="past-only"><span class="sw-new">new</span><span class="scope" data-word="New">New in this commit</span></div>
        <div class="past-only"><svg viewBox="0 0 34 10"><path class="sw sw-removed" d="M1 5h30"/></svg><span class="scope" data-word="Removed">Removed in this commit</span></div>
      </details>

      <div class="zoom hud">
        <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out">−</button>
        <button type="button" data-zoom="fit" aria-label="Fit map to screen" title="Fit to screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button type="button" data-zoom="files" aria-label="Show or hide the files in every part" title="Show / hide files in every part">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9M5 20h9"/></svg>
        </button>
      </div>

      <div id="tip" class="tip" role="tooltip" hidden></div>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="timeline" class="timeline" aria-label="Git history" hidden>
      <div class="tl-head">
        <div class="seg" role="group" aria-label="Which commits to show">
          <button type="button" data-all="0" aria-pressed="true" title="One step per merged PR or direct commit on this branch">PRs &amp; merges</button>
          <button type="button" data-all="1" aria-pressed="false" title="Every commit, including the ones inside merged branches">All commits</button>
        </div>
        <div id="tl-caption" class="tl-caption"></div>
        <div class="tl-nav">
          <button type="button" data-step="-1" aria-label="Older commit" title="Older (←)">‹</button>
          <button type="button" data-step="1" aria-label="Newer commit" title="Newer (→)">›</button>
          <button id="tl-compare" type="button" class="tl-live" data-compare aria-pressed="false" title="Everything this branch would bring into main when merged, like a pull request's Files changed">Compare with main</button>
          <button id="tl-live" type="button" class="tl-live" data-live>Live</button>
        </div>
      </div>
      <div class="tl-track">
        <svg id="tl-chart" class="tl-chart" aria-hidden="true"></svg>
        <input id="tl-range" type="range" min="0" max="0" step="1" value="0" aria-label="Point in history">
        <div id="tl-tip" class="tl-tip" role="tooltip" hidden></div>
      </div>
      <div class="tl-axis"><span id="tl-first"></span><span id="tl-status" class="tl-status"></span><span>Now</span></div>
    </section>
    </div>

    <aside class="side">
      <section id="details" class="details" aria-live="polite"></section>
      <section class="feed-panel">
        <header class="panel-head">
          <h2>Live activity</h2>
          <span class="live-dot" aria-hidden="true"></span>
        </header>
        <ol id="feed" class="feed"></ol>
      </section>
      <section id="commit" class="commit-panel" aria-live="polite" hidden></section>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
