# Dogfood: run this repo's own action on every pull request, against the bundled example app.
name: Architecture
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  al-dente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./
        with:
          root: examples/shop
